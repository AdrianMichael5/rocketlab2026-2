server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: rotas do React Router (ex.: /filmes/123) devolvem o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
